server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location = /premium {
        default_type text/html;
        try_files /premium/index.html =404;
    }

    location = /premium/ {
        return 308 /premium;
    }

    location = /premium/sessions {
        default_type text/html;
        try_files /premium/sessions/index.html =404;
    }

    location = /premium/sessions/ {
        return 308 /premium/sessions;
    }

    location = /premium/demo {
        default_type text/html;
        try_files /premium/demo.html =404;
    }

    location = /premium/demo/ {
        return 308 /premium/demo;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
