name: oidc-starter-public-demo

services:
  frontend:
    build:
      context: ../..
      dockerfile: deploy/public-demo/frontend.Dockerfile
    ports:
      - "127.0.0.1:${PUBLIC_DEMO_FRONTEND_PORT}:80"
    restart: unless-stopped
    networks:
      - public-demo

  backend:
    build:
      context: ../..
      dockerfile: deploy/public-demo/backend.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Starter__FrontendOrigin: https://${PUBLIC_DEMO_HOST}
      Starter__AllowedForwardedHosts__0: ${PUBLIC_DEMO_HOST}
      Starter__KnownForwardedProxies__0: ${FORWARDED_PROXY_IP}
      Starter__CookieSameSite: None
      Starter__AntiforgeryCookieSecurePolicy: Always
      Oidc__Authority: ${OIDC_AUTHORITY}
      Oidc__ClientId: ${OIDC_CLIENT_ID}
      Oidc__ClientSecret: ${OIDC_CLIENT_SECRET}
      Oidc__RequireHttpsMetadata: "true"
      ExternalLogin__Google__Enabled: ${GOOGLE_ENABLED}
      ExternalLogin__Google__Options__ClientId: ${GOOGLE_CLIENT_ID}
      ExternalLogin__Google__Options__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      ExternalLogin__Facebook__Enabled: ${FACEBOOK_ENABLED}
      ExternalLogin__Facebook__Options__AppId: ${FACEBOOK_APP_ID}
      ExternalLogin__Facebook__Options__AppSecret: ${FACEBOOK_APP_SECRET}
      ExternalLogin__GitHub__Enabled: ${GITHUB_ENABLED}
      ExternalLogin__GitHub__Options__ClientId: ${GITHUB_CLIENT_ID}
      ExternalLogin__GitHub__Options__ClientSecret: ${GITHUB_CLIENT_SECRET}
    ports:
      - "127.0.0.1:${PUBLIC_DEMO_BACKEND_PORT}:8080"
    restart: unless-stopped
    networks:
      - public-demo

networks:
  public-demo:
    ipam:
      config:
        - subnet: ${PUBLIC_DEMO_DOCKER_SUBNET}
          gateway: ${FORWARDED_PROXY_IP}
