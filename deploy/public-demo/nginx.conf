server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /premium {
        default_type text/html;
        try_files /premium/index.html =404;
    }

    location = /premium/ {
        return 308 https://oidc-starter.mordalabs.com/premium;
    }

    location = /premium/sessions {
        default_type text/html;
        try_files /premium/sessions/index.html =404;
    }

    location = /premium/sessions/ {
        return 308 https://oidc-starter.mordalabs.com/premium/sessions;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
